{% extends 'base.html' %} {% block title %}Edit Profile{% endblock %} {% block
content %}
<h3>Edit Profile</h3>
<form method="post" class="card card-body">
  <div class="mb-3">
    <label class="form-label">Name</label
    ><input
      name="name"
      class="form-control"
      value="{{ current_user.name }}"
      required
    />
  </div>
  <div class="mb-3">
    <label class="form-label">Contact</label
    ><input
      name="contact"
      class="form-control"
      value="{{ current_user.contact or '' }}"
    />
  </div>
  <button class="btn btn-success">Save Profile</button>
</form>
{% endblock %}

{% extends 'base.html' %} {% block title %}Assign Staff{% endblock %} {% block
content %}
<h3>Assign Staff to Trek</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Staff</label>
      <select name="staff_id" class="form-select" required>
        {% for staff in staff_list %}
        <option value="{{ staff.id }}">
          {{ staff.name }} ({{ staff.email }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Trek</label>
      <select name="trek_id" class="form-select" required>
        {% for trek in trek_list %}
        <option value="{{ trek.id }}">
          {{ trek.name }} - {{ trek.location }}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="mt-3"><button class="btn btn-success">Assign</button></div>
</form>
{% endblock %}

{% extends 'base.html' %} {% block title %}Trek Form{% endblock %} {% block
content %}
<h3>{% if trek %}Edit Trek{% else %}Create Trek{% endif %}</h3>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label
      ><input
        name="name"
        class="form-control"
        value="{{ trek.name if trek else '' }}"
        required
      />
    </div>
    <div class="col-md-6">
      <label class="form-label">Location</label
      ><input
        name="location"
        class="form-control"
        value="{{ trek.location if trek else '' }}"
        required
      />
    </div>
    <div class="col-md-4">
      <label class="form-label">Difficulty</label>
      <select name="difficulty" class="form-select">
        {% for d in ['Easy','Moderate','Hard'] %}
        <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>
          {{ d }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Duration (days)</label
      ><input
        type="number"
        min="1"
        name="duration_days"
        class="form-control"
        value="{{ trek.duration_days if trek else 1 }}"
        required
      />
    </div>
    <div class="col-md-4">
      <label class="form-label">Total Slots</label
      ><input
        type="number"
        min="1"
        name="total_slots"
        class="form-control"
        value="{{ trek.total_slots if trek else 1 }}"
        required
      />
    </div>
    <div class="col-md-4">
      <label class="form-label">Start Date</label
      ><input
        type="date"
        name="start_date"
        class="form-control"
        value="{{ trek.start_date if trek else '' }}"
        required
      />
    </div>
    <div class="col-md-4">
      <label class="form-label">End Date</label
      ><input
        type="date"
        name="end_date"
        class="form-control"
        value="{{ trek.end_date if trek else '' }}"
        required
      />
    </div>
    {% if trek %}
    <div class="col-md-4">
      <label class="form-label">Status</label>
      <select name="status" class="form-select">
        {% for s in ['pending','approved','open','closed','completed'] %}
        <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>
          {{ s }}
        </option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
  </div>
  <div class="mt-3">
    <button class="btn btn-success">Save</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin.treks') }}"
      >Cancel</a
    >
  </div>
</form>
{% endblock %}
